name: CI

on:
  push:
    branches: [master]
  pull_request:

# На Windows Python по умолчанию пишет в консоль в cp1252, где нет кириллицы,
# и падает на первом же русском выводе (названия контрактов lint-imports).
env:
  PYTHONUTF8: "1"

jobs:
  check:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Линтер и формат
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Контроль слоёв (NFR-1)
        run: lint-imports --config pyproject.toml

      - name: Собрать каталоги перевода
        run: python tools/i18n.py compile

      - name: Тесты ядра без GUI (NFR-7)
        run: python -m pytest tests --ignore=tests/ui_qt -q

      # PySide6 из pip не несёт системных графических библиотек, а на серверной
      # Ubuntu их нет: без libEGL Qt не загружается даже в режиме offscreen.
      - name: Системные библиотеки для Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0

      - name: Тесты интерфейса
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ui_qt -q
