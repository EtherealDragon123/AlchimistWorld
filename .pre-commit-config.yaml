# Перед коммитом: формат, линтер и контроль слоёв (03 §2, этап 0).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml
      - id: check-json
        exclude: ^src/alchimist/i18n/locale/
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (слои приложения)
        entry: lint-imports --config pyproject.toml
        language: system
        pass_filenames: false
        types: [python]
